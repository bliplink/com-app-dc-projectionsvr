name: Publish ProjectionSvr SaaS image

on:
  workflow_dispatch:
  push:
    branches:
      - saas-crypto

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/com-app-dc-projectionsvr
  SERVICE_NAME: ProjectionSvr
  MAIN_CLASS: ProjectionSvr
  COMMON_REPO: github.com/bliplink/com.app.dc.git
  COMMON_BRANCH: saas-crypto

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout ProjectionSvr repo
        uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Clone common repo
        run: |
          git clone --branch "${COMMON_BRANCH}" "https://x-access-token:${{ secrets.GH_REPO_TOKEN }}@${COMMON_REPO}" /tmp/com.app.dc

      - name: Build common package
        working-directory: /tmp/com.app.dc
        run: mvn -B -U clean install -DskipTests

      - name: Test ProjectionSvr
        run: mvn -B -U test

      - name: Build ProjectionSvr
        run: |
          mvn -B -U clean package dependency:copy-dependencies \
            -DskipTests \
            -DoutputDirectory=target/dependency

      - name: Verify build output
        run: |
          test -d target/classes
          test -d target/dependency
          test -d salt-formula/ProjectionSvr/files/config

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=saas-crypto
            type=sha,format=short,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ProjectionSvr image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            SERVICE_NAME=${{ env.SERVICE_NAME }}
            MAIN_CLASS=${{ env.MAIN_CLASS }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
